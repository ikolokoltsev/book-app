<h1 class="h4 mb-4">Sign in</h1>

@if (error()) {
<div class="alert alert-danger" role="alert">{{ error() }}</div>
}

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="mb-3">
    <label class="form-label" for="username">Username</label>
    <input id="username" class="form-control" formControlName="username" autocomplete="username" />
  </div>

  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input id="password" class="form-control" type="password" formControlName="password"
      autocomplete="current-password" />
  </div>

  <button class="btn btn-primary w-100" [disabled]="form.invalid || submitting()">
    {{ submitting() ? 'Signing in…' : 'Sign in' }}
  </button>
</form>

<p class="mt-3 mb-0">No account? <a routerLink="/register">Register</a></p>

<h1 class="h4 mb-4">Create account</h1>

@if (error()) {
<div class="alert alert-danger" role="alert">{{ error() }}</div>
}

<form [formGroup]="form" (ngSubmit)="submit()">
  <div class="mb-3">
    <label class="form-label" for="username">Username</label>
    <input id="username" class="form-control" formControlName="username" autocomplete="username" />
    @if (form.controls.username.touched && form.controls.username.hasError('minlength')) {
    <div class="form-text text-danger">At least 3 characters.</div>
    }
  </div>

  <div class="mb-3">
    <label class="form-label" for="password">Password</label>
    <input id="password" class="form-control" type="password" formControlName="password" autocomplete="new-password" />
    @if (form.controls.password.touched && form.controls.password.hasError('minlength')) {
    <div class="form-text text-danger">At least 8 characters.</div>
    }
  </div>

  <button class="btn btn-primary w-100" [disabled]="form.invalid || submitting()">
    {{ submitting() ? 'Creating…' : 'Create account' }}
  </button>
</form>

<p class="mt-3 mb-0">Have an account? <a routerLink="/login">Sign in</a></p>

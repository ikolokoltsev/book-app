@if (auth.isLoggedIn()) {
<nav class="navbar navbar-expand-md bg-body-tertiary">
  <div class="container">
    <a class="navbar-brand" routerLink="/books">BookApp</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav"
      aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/books" routerLinkActive="active">Books</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/quotes" routerLinkActive="active">Quotes</a>
        </li>
      </ul>

      <button class="btn btn-sm btn-outline-secondary" (click)="auth.logout()">
        <i class="fa-solid fa-right-from-bracket me-1"></i> Sign out
      </button>
    </div>
  </div>
</nav>
}

<main class="container py-4">
  <router-outlet />
</main>
